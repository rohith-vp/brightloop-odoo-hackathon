# Local development stack.
# Setup: cp .env.example .env, then `docker compose up --build`.
# Services:
#   db   PostgreSQL 16 on localhost:${POSTGRES_PORT:-5432}
#   api  Express API on http://localhost:${API_PORT:-8000}/api
#   web  React + Vite dev server on http://localhost:${WEB_PORT:-5173}

name: brightloop

services:
  db:
    image: postgres:16
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brightloop}
      POSTGRES_USER: ${POSTGRES_USER:-brightloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy from .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: brightloop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      # Built from the POSTGRES_* values so the password is only set in one place.
      # Inside the Compose network the database host is "db".
      DATABASE_URL: postgresql://${POSTGRES_USER:-brightloop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brightloop}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules

  web:
    build:
      context: ./frontend
    container_name: brightloop-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      # Source is mounted for hot reload. node_modules lives in a named volume
      # so the host's folder (or a different OS) never overrides the container's install.
      - ./frontend:/app
      - web_node_modules:/app/node_modules

volumes:
  postgres_data:
  web_node_modules:
  api_node_modules:
